name: pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: docker build -t devops-kubernetes-demo:1.0.0 .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-kubernetes-demo:1.0.0
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
