version: 2
updates:
  # Dependencias de Node.js (package.json)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Las versiones mayores (ej: express 4 → 5, eslint 9 → 10) rompen cosas;
      # se actualizan a mano cuando haya tiempo de probarlas.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Actions usadas en ci.yml y cd.yml
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Imagen base del Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
