<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DevOps Kubernetes Demo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f2744'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='28' fill='white' font-family='sans-serif'%3ED%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header-copy">
          <p class="eyebrow">Application Status</p>
          <h1>DevOps Kubernetes Demo</h1>
          <p class="subtitle">Local CI/CD &amp; Kubernetes Demonstration</p>
        </div>
        <div class="header-meta">
          <p class="version-badge" id="version-badge">v—</p>
          <p class="status-pill" id="status-pill">
            <span class="dot" id="status-dot" aria-hidden="true"></span>
            <span id="status-label">Checking</span>
          </p>
        </div>
      </header>

      <main class="grid" aria-live="polite">
        <article class="card">
          <h2>Application</h2>
          <p class="value" id="application">—</p>
        </article>
        <article class="card card-accent">
          <h2>Version</h2>
          <p class="value" id="version">—</p>
        </article>
        <article class="card">
          <h2>Environment</h2>
          <p class="value" id="environment">—</p>
        </article>
        <article class="card">
          <h2>Status</h2>
          <p class="value" id="status">—</p>
        </article>
        <article class="card">
          <h2>Pod / Hostname</h2>
          <p class="value" id="hostname">—</p>
        </article>
        <article class="card">
          <h2>Uptime</h2>
          <p class="value" id="uptime">—</p>
        </article>
        <article class="card">
          <h2>Node.js</h2>
          <p class="value" id="node-version">—</p>
        </article>
        <article class="card">
          <h2>Timestamp</h2>
          <p class="value" id="timestamp">—</p>
        </article>
      </main>

      <footer class="footer">
        <p>DevOps Demo Ready</p>
        <p class="footer-note" id="refresh-note">Refreshing from /health and /info</p>
      </footer>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
