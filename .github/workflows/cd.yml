name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy Kubernetes
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, Windows, X64]
    environment:
      name: production
      url: http://127.0.0.1:3000
    env:
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image from GHCR
        shell: powershell
        run: |
          docker pull "ghcr.io/${{ github.repository }}:$env:IMAGE_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import image into Kubernetes cluster
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $raw = wsl -d docker-desktop -- ps
          $line = @($raw | Where-Object { $_ -match '/usr/local/bin/containerd$' }) | Select-Object -First 1
          if (-not $line) { throw "No se encontro el runtime del cluster" }
          $ctrPid = ($line.Trim() -split '\s+')[0]
          $image = "ghcr.io/${{ github.repository }}:$env:IMAGE_SHA"
          $tar = Join-Path $env:TEMP "devops-kubernetes-demo-$env:IMAGE_SHA.tar"
          docker save $image -o $tar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "wsl -d docker-desktop -- sh -c `"nsenter -t $ctrPid -m ctr -n k8s.io images import -`" < `"$tar`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Apply manifests and rollout
        shell: powershell
        run: |
          kubectl config use-context docker-desktop
          kubectl apply -f k8s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl set image deployment/devops-demo devops-demo="ghcr.io/${{ github.repository }}:$env:IMAGE_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl rollout status deployment/devops-demo --timeout=180s
