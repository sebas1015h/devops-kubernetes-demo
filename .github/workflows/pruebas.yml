name: pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: docker build -t devops-kubernetes-demo:1.0.0 .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-kubernetes-demo:1.0.0
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag devops-kubernetes-demo:1.0.0 "ghcr.io/${GITHUB_REPOSITORY}:1.0.0"
          docker push "ghcr.io/${GITHUB_REPOSITORY}:1.0.0"

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - shell: powershell
        run: |
          docker pull "ghcr.io/${{ github.repository }}:1.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker tag "ghcr.io/${{ github.repository }}:1.0.0" devops-kubernetes-demo:1.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - shell: powershell
        run: .\scripts\import-image.ps1
      - shell: powershell
        run: |
          kubectl config use-context docker-desktop
          kubectl apply -f k8s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl rollout status deployment/devops-demo --timeout=180s
